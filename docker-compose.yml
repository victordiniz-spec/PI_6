
services:
  postgres:
    image: postgres:17
    container_name: prodsync-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: prodsync
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: prodsync_erp

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U prodsync -d prodsync_erp
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
